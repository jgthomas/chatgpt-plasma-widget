name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install check dependencies
        run: pacman -Syu --noconfirm --needed git python shellcheck diffutils qt6-declarative qt6-webengine libplasma ki18n kpackage

      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check widget
        run: ./scripts/dev.sh check

      - name: Test package installation and upgrade
        run: ./scripts/test-package.sh
